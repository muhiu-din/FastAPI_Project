<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Saver</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .note-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .note-box {
      background-color: white;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 250px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .note-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
      color: #555;
    }
    .note-content {
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>All Notes</h1>

  <div class="note-container">
    {% for note in newDocs %}
      <div style="color: black;" class="note-box">
        <div class="note-title">{{ note.title }}</div>
        <div class="note-content">{{ note.content }}</div>
      </div>
    {% endfor %}
  </div>

</body>
</html>
